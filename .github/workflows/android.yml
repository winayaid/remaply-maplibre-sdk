name: Android

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sdk:
    name: SDK — build, unit tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      # `check` runs unit tests, Android Lint (warnings are errors) and ktlint for every module.
      - name: Check
        run: ./gradlew check --console=plain

      - name: Assemble release AARs
        run: ./gradlew assembleRelease --console=plain

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-sdk-reports
          path: |
            android/**/build/reports/
            android/**/build/test-results/
          retention-days: 7

  sample:
    name: Sample app — build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: samples/android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build, lint, ktlint
        run: ./gradlew assembleDebug lint ktlintCheck --console=plain

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-sample-reports
          path: samples/android/app/build/reports/
          retention-days: 7
