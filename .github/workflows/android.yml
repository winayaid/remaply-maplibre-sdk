name: Android

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sdk:
    name: SDK — build, unit tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      # `check` runs unit tests, Android Lint (warnings are errors) and ktlint for every module.
      - name: Check
        run: ./gradlew check --console=plain

      - name: Assemble release AARs
        run: ./gradlew assembleRelease --console=plain

      # What a release would upload (docs/releasing.md), minus signing: POMs, AARs, sources, javadoc.
      - name: Publish dry run (Maven Local)
        run: |
          ./gradlew publishToMavenLocal --console=plain
          python3 ../scripts/check-publication.py

      - name: Sample builds against the published artifacts
        working-directory: samples/android
        run: ./gradlew -PremaplyFromMavenLocal=true assembleDebug --console=plain

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-sdk-reports
          path: |
            android/**/build/reports/
            android/**/build/test-results/
          retention-days: 7

  instrumented:
    name: Instrumented tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported OS (API_SPEC.md §1) and the latest.
        api-level: [24, 36]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build test APKs
        working-directory: android
        run: ./gradlew :remaply-maps-trial-android:assembleDebugAndroidTest --console=plain

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          working-directory: android
          # SDK instrumented tests, then the sample-screen tests (Phase 6).
          script: |
            ./gradlew :remaply-maps-trial-android:connectedDebugAndroidTest --console=plain
            cd ../samples/android && ./gradlew connectedDebugAndroidTest --console=plain

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-instrumented-api-${{ matrix.api-level }}
          path: |
            android/maps/build/reports/androidTests/
            android/maps/build/outputs/androidTest-results/
            samples/android/app/build/reports/androidTests/
            samples/android/app/build/outputs/androidTest-results/
          retention-days: 7

  sample:
    name: Sample app — build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: samples/android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build, lint, ktlint
        run: ./gradlew assembleDebug lint ktlintCheck --console=plain

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-sample-reports
          path: samples/android/app/build/reports/
          retention-days: 7
