name: iOS

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    name: SDK + sample — lint, unit, integration and UI tests
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install tools
        env:
          # Pinned: the committed sample project must match what this exact version generates.
          XCODEGEN_VERSION: "2.47.0"
        run: |
          curl -sSfL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
          command -v swiftlint >/dev/null || brew install swiftlint

      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

      - name: Pick and boot simulator
        id: sim
        run: |
          mkdir -p build
          DEST=$(scripts/ios-sim-destination.sh)
          echo "destination=$DEST" >> "$GITHUB_OUTPUT"
          UDID="${DEST##*id=}"
          # Booting up front avoids "test runner timed out while preparing" on cold simulators.
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -scheme RemaplyMaps

      - name: SDK unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme RemaplyMaps \
            -destination "${{ steps.sim.outputs.destination }}" \
            -derivedDataPath build/dd-sdk \
            -resultBundlePath build/RemaplyMaps.xcresult \
            | tee build/sdk-test.log | grep -E "Test Case|Executed|error:|warning:|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build/sdk-test.log

      - name: Sample project is up to date with project.yml
        working-directory: samples/ios
        run: |
          xcodegen --version
          xcodegen
          if [ -n "$(git status --porcelain -- .)" ]; then
            echo "::error::samples/ios/RemaplySample.xcodeproj is out of date. Run 'cd samples/ios && xcodegen' and commit."
            git status --porcelain -- .
            git diff -- .
            exit 1
          fi

      - name: Sample UI tests (taps, touch-cancel, rotation)
        run: |
          set -o pipefail
          xcodebuild test \
            -project samples/ios/RemaplySample.xcodeproj \
            -scheme RemaplySample \
            -destination "${{ steps.sim.outputs.destination }}" \
            -derivedDataPath build/dd-sample \
            -resultBundlePath build/RemaplySample.xcresult \
            | tee build/sample-test.log | grep -E "Test Case|Executed|error:|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build/sample-test.log

      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-results
          path: |
            build/*.xcresult
            build/*.log
          retention-days: 7
