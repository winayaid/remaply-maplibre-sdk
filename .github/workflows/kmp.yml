name: KMP sample

on:
  pull_request:
    paths: ["samples/kmp/**", ".github/workflows/kmp.yml"]
  push:
    branches: [main]
    paths: ["samples/kmp/**", ".github/workflows/kmp.yml"]
  workflow_dispatch:

concurrency:
  group: kmp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The sample uses the released SDK (Maven Central and the SPM tag), so it only rebuilds when it changes.
jobs:
  android:
    name: Android app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: samples/kmp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :androidApp:assembleDebug --console=plain

  ios:
    name: iOS app
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build (runs the Kotlin framework step)
        working-directory: samples/kmp/iosApp
        run: |
          set -o pipefail
          xcodebuild build -project iosApp.xcodeproj -scheme iosApp \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO | grep -E "error:|warning:|\*\* BUILD" || true
          test -d build/dd/Build/Products/Debug-iphonesimulator/iosApp.app
