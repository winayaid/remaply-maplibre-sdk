included:
  - ios/Sources
  - ios/Tests
  - samples/ios/RemaplySample
  - Package.swift

excluded:
  - build
  - .build
  - samples/ios/RemaplySample.xcodeproj

disabled_rules:
  # Trailing commas keep diffs to multi-line lists minimal.
  - trailing_comma

opt_in_rules:
  - force_unwrapping
  - empty_count
  - explicit_init
  - fatal_error_message
  - first_where
  - missing_docs
  - modifier_order
  - redundant_nil_coalescing
  - sorted_imports
  - unowned_variable_capture
  - weak_delegate

line_length:
  warning: 130
  error: 160
  ignores_comments: true

large_tuple:
  warning: 3

missing_docs:
  # Every public SDK symbol must carry a doc comment (feeds the DocC reference in Phase 6).
  warning: [open, public]

force_unwrapping:
  severity: error

identifier_name:
  # Short names are idiomatic in the camera math (t, dx, lo/hi) and mirror the Kotlin implementation.
  min_length: 1

type_body_length:
  # MapSession wraps the whole native map; it is split by concern across files instead.
  warning: 350
  error: 450
